# 语枢 · 同义词与口语映射表 v0.1
# 作用：把"人话/黑话"对齐到本体概念、指标或公理。
# 注意：指标自身的正式别名写在 metrics.yaml（single source of truth），此表只放跨切面的口语映射。

terms:
  # ---- 口语 → 指标（触发口径澄清的典型词）
  - {term: 金额, target: {kind: metric, id: GMV}, note: 口语泛指"钱"，无法确定口径 → 必须澄清}
  - {term: 总金额, target: {kind: metric, id: GMV}, note: 仍需澄清口径}
  - {term: 成交金额, target: {kind: metric, id: GMV}, note: 仍需澄清口径}
  - {term: 履约时长, target: {kind: metric, id: AvgFulfillmentHours}}
  - {term: 平均时效, target: {kind: metric, id: AvgFulfillmentHours}}

  # ---- 口语 → 公理/状态（需结合上下文决定最终指标，见 alignment.py 规则）
  - {term: 超时, target: {kind: axiom, id: fulfillment_delay}}
  - {term: 履约超时, target: {kind: axiom, id: fulfillment_delay}}
  - {term: 妥投, target: {kind: status, concept: Shipment, value: 已签收}}

  # ---- 刻意不覆盖（陷阱题：应回答"数据不足"而非猜测）
  - {term: 退货率, target: {kind: unsupported}, note: 无退货表}
  - {term: 退款, target: {kind: unsupported}, note: 无退款字段}
  - {term: 毛利, target: {kind: unsupported}, note: 无成本字段}
  - {term: 成本, target: {kind: unsupported}, note: 无成本字段}
  - {term: 库存, target: {kind: unsupported}, note: 无库存表}
  - {term: 安卓, target: {kind: unsupported}, note: 外部知识，本体不猜测}
