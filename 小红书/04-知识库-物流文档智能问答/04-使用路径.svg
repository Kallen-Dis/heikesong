<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>物流文档入库，索引后再问答 · 4/5</title><rect x="0" y="0" width="1200" height="1600" rx="0" fill="#FAF7F2"/><circle cx="1160" cy="140" r="180" fill="#C2812F"/><rect x="990" y="0" width="210" height="380" fill="#FAF7F2" opacity=".86"/><text x="84" y="85" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#152334" text-anchor="start">DataClawHub</text><text x="1116" y="85" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#576676" text-anchor="end">04 / 08</text><rect x="84" y="125" width="1032" height="2" rx="0" fill="#DDDCD6"/><text x="84" y="188" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#C2812F" text-anchor="start">文档上传 × 智能问答</text><text x="84" y="285" font-family="Microsoft YaHei, sans-serif" font-size="76" font-weight="700" fill="#152334" text-anchor="start">开始使用</text><text x="84" y="380" font-family="Microsoft YaHei, sans-serif" font-size="76" font-weight="700" fill="#152334" text-anchor="start">按这个顺序</text><text x="84" y="465" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576676" text-anchor="start">官网教程给出的知识库使用路径</text><rect x="84" y="1490" width="1032" height="2" rx="0" fill="#DDDCD6"/><text x="84" y="1542" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#576676" text-anchor="start">DATACLAWHUB  /  物流 AI 协作</text><text x="1116" y="1542" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#576676" text-anchor="end">04 / 05</text><rect x="140" y="550" width="976" height="208" rx="30" fill="#FFFFFF"/><circle cx="104" cy="611" r="39" fill="#C2812F"/><text x="104" y="623" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="190" y="620" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700"