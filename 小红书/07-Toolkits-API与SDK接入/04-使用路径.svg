<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>物流AI开发，先看看工具市场 · 4/5</title><rect x="0" y="0" width="1200" height="1600" rx="0" fill="#FAF7F2"/><circle cx="1160" cy="140" r="180" fill="#5B68D2"/><rect x="990" y="0" width="210" height="380" fill="#FAF7F2" opacity=".86"/><text x="84" y="85" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#152334" text-anchor="start">DataClawHub</text><text x="1116" y="85" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#576676" text-anchor="end">07 / 08</text><rect x="84" y="125" width="1032" height="2" rx="0" fill="#DDDCD6"/><text x="84" y="188" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#5B68D2" text-anchor="start">Toolkits 工具市场</text><text x="84" y="285" font-family="Microsoft YaHei, sans-serif" font-size="76" font-weight="700" fill="#152334" text-anchor="start">从工具入口</text><text x="84" y="380" font-family="Microsoft YaHei, sans-serif" font-size="76" font-weight="700" fill="#152334" text-anchor="start">走到实际接入</text><text x="84" y="465" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576676" text-anchor="start">先看文档，再配置应用。</text><rect x="84" y="1490" width="1032" height="2" rx="0" fill="#DDDCD6"/><text x="84" y="1542" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#576676" text-anchor="start">DATACLAWHUB  /  物流 AI 协作</text><text x="1116" y="1542" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#576676" text-anchor="end">04 / 05</text><rect x="140" y="550" width="976" height="208" rx="30" fill="#FFFFFF"/><circle cx="104" cy="611" r="39" fill="#5B68D2"/><text x="104" y="623" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="190" y="620" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#152334" text-anchor="start">浏览登记内容</text><text x="190" y="679" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576676" text-anchor="start">根据场景查找 API、Agent 或 SDK。</text><path d="M104 658 L104 777" fill="none" stroke="#5B68D2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 9"/><rect x="140" y="788" width="976" height="208" rx="30" fill="#FFFFFF"/><circle cx="104" cy="849" r="39" fill="#5B68D2"/><text x="104" y="861" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="190" y="858" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#152334" text-anchor="start">核对接口说明</text><text x="190" y="917" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576676" text-anchor="start">参数、权限、调用条件以文档为准。</text><path d="M104 896 L104 1015" fill="none" stroke="#5B68D2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 9"/><rect x="140" y="1026" width="976" height="208" rx="30" fill="#FFFFFF"/><circle cx="104" cy="1087" r="39" fill="#5B68D2"/><text x="104" y="1099" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="190" y="1096" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#152334" text-anchor="start">按要求接入</text><text x="190" y="1155" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576676" text-anchor="start">使用平台允许的 Key 与接入方式。</text><text x="84" y="1413" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#576676" text-anchor="start">不要把 API Key 放入公开文案、截图或代码。</text></svg>